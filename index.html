          <h2>Gde trenutno gubite potencijalnog klijenta?</h2>
          <p>Pre nego što predložimo rešenje, pokušavamo da razumemo gde nastaje problem i šta bi zaista imalo smisla promeniti.</p>
          <a href="#act-5-your-business">Zatražite početnu analizu</a>

        <!-- ACT 2: THE CUSTOMER JOURNEY -->
        <section id="act-2-the-customer-journey">
          <p><small>EDUKATIVNI PRIMER</small></p>
          <h2>Zamislite da ste vaš klijent.</h2>
          <p>Tražite uslugu. Imate nekoliko opcija. Koga ćete izabrati?</p>
          <p>Primer pretrage: frizerski salon Čačak</p>
          <p><strong>Vaš potencijalni klijent već bira. I to često pre nego što je razgovarao sa vama.</strong></p>
          <ol>
            <li>1. Pronalazi vas</li>
            <li>2. Razume ponudu</li>
            <li>3. Stiče poverenje</li>
            <li>4. Poredi</li>
            <li>5. Pravi sledeći korak</li>
            <li>6. Postaje klijent</li>
          </ol>
          <h3>Negde na ovom putu možete da ga izgubite.</h3>
          <p>Problem je što mesto na kojem ga gubite nije uvek očigledno.</p>
          <ul>
            <li>Možda vas ne pronalazi.</li>
            <li>Možda vas pronađe, ali ne razume ponudu.</li>
            <li>Možda razume ponudu, ali vam još ne veruje.</li>
            <li>Možda želi da vas kontaktira, ali je sledeći korak komplikovan.</li>
            <li>Možda dobijate upite, ali vaš interni proces gubi vreme.</li>
          </ul>
          <p><strong>Zato „treba nam novi sajt“ još nije dijagnoza.</strong></p>
        </section>

        <!-- ACT 3: THE DIAGNOSIS -->
        <section id="act-3-the-diagnosis">
          <h2>Zato prvo tražimo uzrok.</h2>
          <p>Ne pokušavamo da menjamo sve. Tražimo ono što najviše koči rezultat.</p>
          <div>
            <h3>01 — Vidljivost: Da li vas pravi ljudi uopšte pronalaze?</h3>
            <h3>02 — Jasnoća ponude: Da li ljudi brzo razumeju šta nudite i zašto je relevantno za njih?</h3>
            <h3>03 — Poverenje: Da li imaju dovoljno razloga da izaberu vas?</h3>
            <h3>04 — UX / Konverzija: Da li je sledeći korak očigledan i jednostavan?</h3>
            <h3>05 — Proces: Da li gubite vreme na stvari koje mogu da budu jednostavnije?</h3>
            <h3>06 — Tehnologija: Da li postojeći sistem podržava način na koji biznis danas radi?</h3>
          </div>
          <p><strong>Ne menjamo sve. Menjamo ono što koči rezultat.</strong></p>
          <p><strong>Pravi problem određuje pravi alat. Novi sajt je samo jedna od mogućih preporuka.</strong></p>
          
          <h3>Naš proces:</h3>
          <ol>
            <li><strong>Discovery:</strong> Razumemo biznis, cilj i kontekst.</li>
            <li><strong>Research:</strong> Tražimo dokaze umesto pretpostavki.</li>
            <li><strong>Strategija:</strong> Određujemo šta ima najviše smisla uraditi.</li>
            <li><strong>UX:</strong> Projektujemo najjasniji put za korisnika.</li>
            <li><strong>Development:</strong> Gradimo rešenje koje podržava strategiju.</li>
            <li><strong>Merenje:</strong> Proveravamo šta se stvarno dogodilo.</li>
          </ol>
          <p><strong>Launch nije kraj. Tek tada dobijamo stvarne podatke.</strong></p>
        </section>

        <!-- ACT 4: THE PROOF -->
        <section id="act-4-the-proof">
          <h2>Strategija vredi samo ako može da se sprovede.</h2>
          <p>Zato kod nas strategija, UX i development nisu odvojeni svetovi.</p>
          <article>
            <h3>Frizerski Salon Stevan</h3>
            <p>Problem: Klijenti su zvali tokom rada sa istim pitanjima o cenama i lokaciji.</p>
            <p>Odluka: Postaviti jasan cenovnik, lokaciju i 1-klik poziv u prvi plan na telefonu.</p>
            <p>Realizacija: Ultra-brz mobilni sajt i optimizovan Google Business profil.</p>
            <p>Ishod: Znatno manje ponavljajućih poziva; klijenti dolaze unapred informisani.</p>
          </article>
          <article>
            <h3>Ada Studio</h3>
            <p>Problem: Prethodna prezentacija nije odražavala visok estetski nivo i radove je bilo teško ažurirati.</p>
            <p>Odluka: Kreirati minimalističku galeriju fokusiranu na visoku rezoluciju radova i jednostavan CMS.</p>
            <p>Realizacija: Prilagođena arhitektura i fluidno pretraživanje projekata.</p>
            <p>Ishod: Prezentacija koja odmah gradi poverenje sa premijum klijentima.</p>
          </article>
          <article>
            <h3>Altara Inmo / Softverski Sistemi</h3>
            <p>Problem: Posetioci su teško pronalazili odgovarajuće nekretnine zbog sporog filtriranja.</p>
            <p>Odluka: Projektovati sistem sa instant filtriranjem, mapom i direktnim kontaktom agenata.</p>
            <p>Realizacija: Kompletna web aplikacija, dinamička baza podataka i optimizovan mobilni pregled.</p>
            <p>Ishod: Brza pretraga bez čekanja i veći broj posetilaca koji zakazuju razgledanje.</p>
          </article>
          <div>
            <h3>Ne prodajemo unapred određeno rešenje.</h3>
            <p><strong>Ako vam novi sajt nije potreban, reći ćemo vam.</strong></p>
            <p>Možda je sledeći pravi potez bolji Google profil, booking, jedna landing stranica, automatizacija ili nekoliko preciznih izmena na postojećem sistemu.</p>
            <p>Cilj nije najveći projekat. Cilj je pravi sledeći potez.</p>
          </div>
        </section>

          <h3>Hajde da pogledamo.</h3>
          <p>Pre prvog razgovora možemo da pogledamo vaš trenutni digitalni nastup kako bismo razgovor započeli konkretnim zapažanjima.</p>
          <p><small>Početni pregled nije kompletan UX, SEO ili tehnički audit. Njegov cilj je da razumemo kontekst pre razgovora.</small></p>
