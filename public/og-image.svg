<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.25)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Container Box -->
  <g transform="translate(100, 100)">
    <!-- Badge -->
    <rect width="360" height="42" rx="21" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" />
    <text x="24" y="27" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">
      WEB STRATEGIJA • UX • DEVELOPMENT
    </text>

    <!-- Main Headline -->
    <text x="0" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      Izrada Sajtova Čačak &amp; Beograd
    </text>

    <!-- Gradient Sub-headline -->
    <text x="0" y="200" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700">
      Brzi, Moderni i SEO Optimizovani Sajtovi
    </text>

    <!-- Description -->
    <text x="0" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Ne počinjemo šablonom. Projektujemo sisteme sa 100/100 PageSpeed
    </text>
    <text x="0" y="300" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      brzinom koji pretvaraju posetioce u stvarne kupce.
    </text>

    <!-- Bottom Features Chips -->
    <g transform="translate(0, 360)">
      <!-- Chip 1 -->
      <rect width="170" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
      <text x="20" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">⚡ &lt; 0.5s Brzina</text>

      <!-- Chip 2 -->
      <g transform="translate(190, 0)">
        <rect width="180" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
        <text x="20" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">🔍 Tehnički SEO</text>
      </g>

      <!-- Chip 3 -->
      <g transform="translate(390, 0)">
        <rect width="210" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
        <text x="20" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">📱 Mobile-First Dizajn</text>
      </g>

      <!-- Domain / Brand -->
      <g transform="translate(740, 0)">
        <text x="0" y="27" fill="#60a5fa" font-family="monospace" font-size="18" font-weight="700">ssolutions.click</text>
      </g>
    </g>
  </g>
</svg>
