<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090c; color: #f1efe9;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1.5rem; }
    @media (prefers-color-scheme: light) { body { background: #f3f1ec; color: #0d0e11; } }
    .code { font-size: clamp(5rem, 22vw, 12rem); font-weight: 700; letter-spacing: -0.06em; line-height: 0.9; margin: 0; }
    .code span { color: #5b82ff; }
    p { opacity: 0.7; font-size: 1.1rem; max-width: 28rem; margin: 1.5rem auto 2rem; }
    a { display: inline-block; background: #5b82ff; color: #08090c; padding: 0.9rem 1.6rem; border-radius: 999px; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  </style>
</head>

    <h1 class="code">404<span>.</span></h1>
